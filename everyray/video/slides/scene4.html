<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700;1,900&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body {
    position: relative;
    background-color: #EDE6D6;
    font-family: 'Hanken Grotesk', sans-serif;
  }
  /* paper grain: SVG noise as a background-image (renders correctly under
     html2canvas, unlike mix-blend-mode on live elements) */
  .grain {
    position: absolute; inset: 0;
    opacity: 0.4;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.27  0 0 0 0 0.20  0 0 0 0 0.08  0 0 0 0.09 0"/></filter><rect width="100%" height="100%" filter="url(%23n)"/></svg>');
    background-size: 200px 200px;
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(60,45,20,0.10) 100%);
  }

  /* header band */
  .header-band { position: absolute; top: 56px; left: 70px; right: 70px; display: flex; align-items: center; gap: 18px; }
  .rule { flex: 1; height: 1px; background: #4565A8; opacity: 0.55; }
  .brand-label { font-size: 15px; letter-spacing: 0.22em; color: #4565A8; font-weight: 600; white-space: nowrap; }

  /* logo top-right */
  .logo { position: absolute; top: 40px; right: 60px; opacity: 0.95; }

  main { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 70px; }
  .text-col { width: 40%; padding-right: 40px; z-index: 2; }
  .kicker { font-size: 16px; letter-spacing: 0.18em; text-transform: uppercase; color: #4565A8; font-weight: 600; margin-bottom: 18px; opacity: 0.85; }
  .headline {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 900;
    color: #3C5696;
    font-size: 76px;
    line-height: 1.04;
    letter-spacing: -0.01em;
  }
  .headline.tight { font-size: 64px; }
  .sub { margin-top: 26px; font-size: 21px; line-height: 1.5; color: #4565A8; font-weight: 400; max-width: 480px; }

  .visual-col { width: 60%; display: flex; align-items: center; justify-content: center; z-index: 2; }
  .device-frame {
    width: 100%;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 30px 70px rgba(60,45,20,0.22), 0 4px 18px rgba(60,45,20,0.12);
    border: 1px solid rgba(69,101,168,0.25);
  }
  .device-frame img { display: block; width: 100%; }

  /* title-only (brand) frames */
  .brand-frame { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2; }
  .brand-frame .headline { font-size: 150px; text-align: center; }
  .brand-frame .tagline { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700; font-size: 34px; color: #4565A8; margin-top: 18px; opacity: 0.9; }

  footer.fnote { position: absolute; bottom: 48px; left: 70px; right: 70px; display: flex; align-items: center; gap: 18px; }
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="vignette"></div>
  <svg style="position:absolute; right:-280px; bottom:-300px; width:900px; height:900px; opacity:0.6;" viewBox="0 0 900 900">
    <defs>
      <radialGradient id="gradBR" cx="38%" cy="38%" r="60%">
        <stop offset="0%" stop-color="#F2EF7A"/>
        <stop offset="42%" stop-color="#C9F06A"/>
        <stop offset="72%" stop-color="#A5DDA0"/>
        <stop offset="100%" stop-color="#A5DDA0" stop-opacity="0"/>
      </radialGradient>
      <filter id="blurBR" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="55"/>
      </filter>
    </defs>
    <circle cx="450" cy="450" r="330" fill="url(#gradBR)" filter="url(#blurBR)"/>
  </svg>
  <svg style="position:absolute; left:-260px; top:30%; width:620px; height:620px; opacity:0.4;" viewBox="0 0 620 620">
    <defs>
      <radialGradient id="gradL" cx="50%" cy="50%" r="55%">
        <stop offset="0%" stop-color="#F2EF7A"/>
        <stop offset="50%" stop-color="#C9F06A"/>
        <stop offset="100%" stop-color="#C9F06A" stop-opacity="0"/>
      </radialGradient>
      <filter id="blurL" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="50"/>
      </filter>
    </defs>
    <circle cx="310" cy="310" r="220" fill="url(#gradL)" filter="url(#blurL)"/>
  </svg>

  <header class="header-band">
    <div class="rule"></div>
    <span class="brand-label">EVERYRAY</span>
    <div class="rule"></div>
  </header>

  <svg class="logo" width="60" height="60" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M32 2C17 2 6 14 6 28c0 19 26 34 26 34s26-15 26-34C58 14 47 2 32 2z" fill="#FBF8F0" stroke="#4565A8" stroke-width="2"/>
    <clipPath id="pinclip"><path d="M32 2C17 2 6 14 6 28c0 19 26 34 26 34s26-15 26-34C58 14 47 2 32 2z"/></clipPath>
    <g clip-path="url(#pinclip)">
      <circle cx="32" cy="26" r="24" fill="#F2EF7A"/>
      <path d="M32 2 L56 26 L32 50 L8 26 Z" fill="#C9F06A"/>
      <circle cx="32" cy="26" r="11" fill="#9BE03C"/>
      <path d="M8 26 L32 2 L32 26 Z" fill="#4565A8" opacity="0.75"/>
      <path d="M56 26 L32 50 L32 26 Z" fill="#8BBF85" opacity="0.85"/>
    </g>
  </svg>


  <main>
    <div class="text-col">
      <div class="kicker">Zone by zone</div>
      <div class="headline tight">Every Hour,<br>Every Season</div>
      <div class="sub">We segment the grid and simulate what solar and batteries change.</div>
    </div>
    <div class="visual-col">
      <div class="device-frame"><img src="../frames/zone_screen.png"></div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</body>
</html>
